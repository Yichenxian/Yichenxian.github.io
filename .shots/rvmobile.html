<!doctype html><meta charset="utf-8"><title>rv-harness</title>
<style>html,body{margin:0;background:#0b0405}iframe{border:0;display:block}</style>
<iframe id="f" src="/escape.html?solo=1&t=0" width="375" height="667"></iframe>
<script>
var f = document.getElementById('f');
f.src = '/escape.html?solo=1&t=' + Date.now();
function d(){ return f.contentDocument; }
function w(){ return f.contentWindow; }
function click(id){ var el = d().getElementById(id); if (el) el.click(); return !!el; }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function measure(){
  var doc = d(), win = w();
  var o = doc.getElementById('ovReview');
  var p = o.querySelector('.review-panel');
  var rp = p.getBoundingClientRect();
  var btn = doc.getElementById('btnBackToRoom').getBoundingClientRect();
  return {
    cls: o.className,
    vw: win.innerWidth, vh: win.innerHeight,
    panel: [Math.round(rp.width), Math.round(rp.height)],
    panelScroll: [p.scrollHeight, p.clientHeight],
    panelOverflow: p.scrollHeight - p.clientHeight,
    btnBottom: Math.round(btn.bottom),
    btnVisible: btn.bottom <= win.innerHeight + 0.5,
    docScroll: doc.documentElement.scrollHeight,
    title: doc.getElementById('rvTitle').textContent,
    sub: doc.getElementById('rvSub').textContent,
    rows: doc.querySelectorAll('#rvPerPlayer .rv-tr').length,
    tableRight: Math.round(doc.getElementById('rvPerPlayer').getBoundingClientRect().right)
  };
}
window.__run = async function(kind){
  await wait(1600);
  click('btnStart'); await wait(700);
  for (var i = 0; i < 3; i++){ click('btnAddBot'); await wait(280); }
  click('btnCreateRoom'); await wait(1300);
  click('btnStartGame'); await wait(1700);
  click('btnAbilityClose'); await wait(1100);
  try { w().EscapeDebug.end(kind === 'win'); } catch(e){ return 'ERR ' + e.message; }
  await wait(1000);
  var m = measure();
  document.title = 'RV ' + JSON.stringify(m);
  return m;
};
</script>
