<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050806">
<title>迷宫寻路 · 像素迷宫</title>
<link rel="stylesheet" href="maze.css?v=20261104n">
</head>
<body>

<!-- 顶部栏：左上角返回 -->
<header class="topbar">
  <a class="back" href="index.html" aria-label="返回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    <span>返回</span>
  </a>
  <div class="brand">迷宫寻路</div>
</header>

<div class="wrap" id="wrap">
  <div class="app">

    <!-- 游戏画面 + 上方音乐条 -->
    <div class="stagewrap" id="stagewrap">

    <!-- 背景音乐条：播放/暂停 · 曲名 · 音量 · 上传转 8bit -->
    <div class="musicbar" id="musicbar">
      <button class="mb-btn mb-play" id="mbPlay" type="button" aria-label="播放背景音乐">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.4 5.3v13.4L19 12z" fill="currentColor"/>
        </svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7.2" y="5.4" width="3.4" height="13.2" rx="1" fill="currentColor"/>
          <rect x="13.4" y="5.4" width="3.4" height="13.2" rx="1" fill="currentColor"/>
        </svg>
      </button>

      <button class="mb-badge" id="mb8bit" type="button" aria-pressed="true"
              title="切换 8BIT / 原声">8BIT</button>
      <span class="mb-title" id="mbTitle">Cool &amp; Powerful</span>
      <span class="mb-eq" id="mbEq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="mb-gap"></span>

      <button class="mb-btn" id="mbReset" type="button" aria-label="切回默认音乐" title="切回默认音乐" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12a7 7 0 1 1-2.2-5.1" fill="none" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round"/>
          <path d="M19.4 4.6v4.2h-4.2" fill="none" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="mb-btn mb-up" id="mbUpload" type="button" aria-label="上传音乐并转成 8bit" title="上传音乐 · 自动转 8bit">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.6V5.4m0 0L8.3 9.1M12 5.4l3.7 3.7" fill="none" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.8 15.2v2.6a2 2 0 0 0 2 2h10.4a2 2 0 0 0 2-2v-2.6" fill="none"
                stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span class="mb-ulabel">上传</span>
      </button>
      <input type="file" id="mbFile" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac,.opus" hidden>

      <div class="mb-vol">
        <button class="mb-btn mb-mute" id="mbMute" type="button" aria-label="音乐静音">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.4v5.2h3.3L12 18.6V5.4L7.3 9.4H4Z" fill="currentColor"/>
            <path class="wave" d="M15.3 9.3a3.8 3.8 0 0 1 0 5.4" fill="none"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path class="wave" d="M17.8 7a7.6 7.6 0 0 1 0 10" fill="none"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path class="cross" d="M16.6 9.2 21 13.6M21 9.2 16.6 13.6" fill="none"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <input type="range" id="mbVol" min="0" max="100" step="1" value="48"
               aria-label="音乐音量">
      </div>
    </div>

    <div class="stage" id="stage">
      <canvas id="cv" width="720" height="720"></canvas>

      <div class="hud" id="hud">
        <span class="t" id="hudTime">00:00.00</span>
        <span class="fogtag" id="hudFog" hidden>迷雾</span>
        <span id="hudSteps">0 步</span>
      </div>

      <!-- 开始 -->
      <div class="overlay show" id="ovStart">
        <div class="title">迷宫寻路</div>
        <div class="sub">30 × 30 像素迷宫<br>走到红色格即通关</div>
        <button class="btn primary" id="btnStart">开始游戏</button>
      </div>

      <!-- 出发前设置：颜色 + 地图大小 + 迷雾 -->
      <div class="overlay" id="ovSetup">
        <div class="title small">出发前设置</div>
        <div class="preview" id="preview"></div>
        <div class="swatches" id="swatches"></div>
        <label class="picker">
          <span>自定义</span>
          <input type="color" id="cpick" value="#ffffff">
        </label>

        <div class="fields">
          <label class="field">
            <span class="field-label">地图大小</span>
            <input type="range" id="sizeRange" class="field-range"
                   min="30" max="100" step="1" value="30" aria-label="地图大小">
            <b class="field-val" id="sizeVal">30×30</b>
          </label>
          <label class="field">
            <span class="field-label">迷雾模式</span>
            <span class="sw">
              <input type="checkbox" id="fogChk" aria-label="迷雾模式">
              <i></i>
            </span>
          </label>
          <div class="field-note" id="sizeNote" hidden>画面会跟随主角移动</div>
        </div>

        <button class="btn primary" id="btnEnter">进入迷宫</button>
        <button class="btn link" id="btnBack">← 返回</button>
      </div>

      <!-- 生成中 -->
      <div class="overlay" id="ovGen">
        <div class="title small">正在生成迷宫…</div>
        <div class="bar"><i id="barFill"></i></div>
        <div class="pct" id="genPct">0%</div>
        <div class="sub" id="genTip">初始化网格…</div>
      </div>

      <!-- 通关 -->
      <div class="overlay" id="ovWin">
        <div class="title">🎉 恭喜通关！</div>
        <div class="stats">
          <div><span>用时</span><b id="winTime">00:00.00</b></div>
          <div><span>步数</span><b id="winSteps">0</b></div>
        </div>
        <button class="btn primary" id="btnRestart">重新开始</button>
      </div>
    </div>
    </div><!-- /stagewrap -->

    <div class="side" id="side">
      <button class="btn ghost" id="btnKb">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="6" width="20" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <rect x="5" y="9" width="2.2" height="2.2" rx=".6" fill="currentColor"/>
          <rect x="9" y="9" width="2.2" height="2.2" rx=".6" fill="currentColor"/>
          <rect x="13" y="9" width="2.2" height="2.2" rx=".6" fill="currentColor"/>
          <rect x="17" y="9" width="2.2" height="2.2" rx=".6" fill="currentColor"/>
          <rect x="7" y="13.4" width="10" height="2.2" rx=".6" fill="currentColor"/>
        </svg>
        <span id="kbLabel">呼出虚拟键盘</span>
      </button>

      <div class="pad" id="pad">
        <button data-dir="up"    style="grid-area:u">W</button>
        <button data-dir="left"  style="grid-area:l">A</button>
        <button data-dir="down"  style="grid-area:d">S</button>
        <button data-dir="right" style="grid-area:r">D</button>
      </div>

      <!-- 虚拟按键下方：音效音量 -->
      <div class="opts">
        <span class="opt-label">音效</span>
        <div class="vol">
          <button class="volbtn" id="muteBtn" type="button" aria-label="静音">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.4v5.2h3.3L12 18.6V5.4L7.3 9.4H4Z" fill="currentColor"/>
              <path class="wave" d="M15.3 9.3a3.8 3.8 0 0 1 0 5.4"
                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path class="wave" d="M17.8 7a7.6 7.6 0 0 1 0 10"
                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path class="cross" d="M16.6 9.2 21 13.6M21 9.2 16.6 13.6"
                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
          <input type="range" id="volRange" min="0" max="100" step="1" value="60"
                 aria-label="音效音量">
        </div>
      </div>

      <div class="foot">
        WASD / ↑↓←→ 移动<br>
        每按一次走一格 · 踩到红色格通关<br>
        点 <b class="foot-key">8BIT</b> 切换 8bit / 原声
      </div>
    </div>

  </div>
</div>

<script src="bitcrush.js?v=20261104n"></script>
<script src="maze.js?v=20261104n"></script>
<script src="maze-music.js?v=20261104n"></script>
</body>
</html>
